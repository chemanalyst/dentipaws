<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 68" width="290" height="68" role="img">
  <title>DentiPaws logo</title>

  <!-- Icon background -->
  <rect x="0" y="2" width="64" height="64" rx="16" fill="#FF6B6B"/>

  <!-- Tooth crown — well centered in 64px square -->
  <rect x="10" y="8" width="44" height="28" rx="10" fill="white"/>

  <!-- Tooth roots — left and right with clear gap -->
  <rect x="10" y="33" width="18" height="17" rx="7" fill="white"/>
  <rect x="36" y="33" width="18" height="17" rx="7" fill="white"/>

  <!-- Paw print — 4 toes + central pad, coral on white, fits inside crown -->
  <!-- Central pad -->
  <ellipse cx="32" cy="29" rx="6.5" ry="5.5" fill="#FF6B6B"/>
  <!-- Top-left toe -->
  <circle cx="20" cy="20" r="4" fill="#FF6B6B"/>
  <!-- Top-centre-left toe -->
  <circle cx="28" cy="16" r="4" fill="#FF6B6B"/>
  <!-- Top-centre-right toe -->
  <circle cx="36" cy="16" r="4" fill="#FF6B6B"/>
  <!-- Top-right toe -->
  <circle cx="44" cy="20" r="4" fill="#FF6B6B"/>

  <!-- Wordmark — full coral so it works on both light and dark backgrounds -->
  <text x="78" y="46"
    font-family="'Nunito', 'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="36"
    fill="#FF6B6B"
    letter-spacing="-0.5">DentiPaws</text>
</svg>
