<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
  <title>DentiPaws favicon</title>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#FF6B6B"/>

  <!-- Tooth crown -->
  <rect x="14" y="7" width="36" height="30" rx="10" fill="white"/>
  <!-- Tooth left root -->
  <rect x="14" y="33" width="15" height="18" rx="6" fill="white"/>
  <!-- Tooth right root -->
  <rect x="35" y="33" width="15" height="18" rx="6" fill="white"/>

  <!-- Paw print — coral on white -->
  <!-- Central pad -->
  <ellipse cx="32" cy="30" rx="6.5" ry="5.5" fill="#FF6B6B"/>
  <!-- Top-left toe -->
  <circle cx="20" cy="21" r="3.5" fill="#FF6B6B"/>
  <!-- Top-centre-left toe -->
  <circle cx="28" cy="17" r="3.5" fill="#FF6B6B"/>
  <!-- Top-centre-right toe -->
  <circle cx="36" cy="17" r="3.5" fill="#FF6B6B"/>
  <!-- Top-right toe -->
  <circle cx="44" cy="21" r="3.5" fill="#FF6B6B"/>
</svg>
